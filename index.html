<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<title>当日の摂取計画ワークシート</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #F4F7FA;
    --surface: #FFFFFF;
    --surface-rail: #EAF1F6;
    --navy: #1E3A5F;
    --navy-deep: #16293F;
    --orange: #FF6B35;
    --ink: #1F2937;
    --ink-soft: #55606E;
    --muted: #8792A0;
    --line: #DCE4EC;
    --input-bg: #FBFCFD;
    --input-border: #C9D4DF;
    --cat-n: #C0392B;
    --cat-h: #2266CC;
    --cat-b: #7B3FA0;
    --chip-fg: #FFFFFF;
    --focus: #FF6B35;
    --shadow: 0 1px 2px rgba(30,58,95,0.06), 0 6px 16px rgba(30,58,95,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161F;
      --surface: #1A2431;
      --surface-rail: #223047;
      --navy: #7FA6D6;
      --navy-deep: #0C121A;
      --orange: #FF8B5E;
      --ink: #E7ECF2;
      --ink-soft: #AEB9C6;
      --muted: #7C8899;
      --line: #2E3B4D;
      --input-bg: #131B25;
      --input-border: #34435A;
      --cat-n: #E67365;
      --cat-h: #6FA0F0;
      --cat-b: #B285D9;
      --chip-fg: #0C121A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    padding-inline: 16px;
    padding-block: 14px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .wrap { max-width: 640px; margin: 0 auto; min-width: 0; }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    padding-block: 6px 10px;
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    color: var(--orange);
    letter-spacing: 0.08em;
    margin: 0 0 4px;
  }
  h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.3;
    color: var(--navy);
    margin: 0 0 2px;
    text-wrap: balance;
  }
  .subtitle {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track {
    flex: 1;
    height: 7px;
    border-radius: 99px;
    background: var(--surface-rail);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--orange), #FF9466);
    border-radius: 99px;
    transition: width 0.35s ease;
  }
  .progress-label {
    font-size: 11.5px;
    color: var(--ink-soft);
    white-space: nowrap;
    font-weight: 700;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  .intro {
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .intro p { margin: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
    min-width: 0;
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11px; color: var(--muted); font-weight: 700; }
  .field input {
    font: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--ink);
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }
  .field input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .field-hint { font-size: 10.5px; color: var(--muted); margin: 4px 0 0; }

  @media (max-width: 380px) {
    .fields { grid-template-columns: 1fr; }
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    padding: 10px 16px;
    margin-bottom: 16px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .timeline { display: flex; flex-direction: column; }
  .event {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 10px;
    position: relative;
    min-width: 0;
  }
  .rail {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .rail .line {
    width: 2px;
    flex: 1;
    background: var(--line);
  }
  .rail .node {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--orange);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1.5px var(--orange);
    flex-shrink: 0;
    margin-top: 4px;
  }
  .event:first-child .rail .line.top { visibility: hidden; }
  .event:last-child .rail .line.bottom { visibility: hidden; }
  .rail .line.top { height: 14px; flex: 0 0 auto; }
  .rail .line.bottom { flex: 1 1 auto; min-height: 10px; }

  .event-body { padding-bottom: 20px; min-width: 0; }
  .event-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .time-input {
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    background: var(--surface-rail);
    border: 1.5px solid transparent;
    padding: 4px 6px;
    border-radius: 6px;
    width: 5.8em;
    min-width: 0;
    text-align: center;
  }
  .time-input::placeholder { color: var(--muted); font-weight: 700; opacity: 0.7; }
  .time-input:focus-visible { outline: none; border-color: var(--focus); background: var(--input-bg); }
  .event-name {
    font-size: 15.5px;
    font-weight: 900;
    color: var(--ink);
  }

  .examples {
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .examples li {
    font-size: 12.5px;
    line-height: 1.55;
    padding-left: 14px;
    position: relative;
  }
  .examples li::before {
    content: '・';
    position: absolute;
    left: 0;
  }
  .examples li.n { color: var(--cat-n); }
  .examples li.h { color: var(--cat-h); }
  .examples li.b { color: var(--cat-b); }

  textarea.plan {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: 10px;
    padding: 10px 11px;
    resize: none;
    line-height: 1.5;
    min-height: 44px;
    field-sizing: content;
  }
  textarea.plan::placeholder { color: var(--muted); }
  textarea.plan:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
  textarea.plan.filled { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 6%, var(--input-bg)); }

  .plan-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
    margin: 0 0 4px;
    letter-spacing: 0.03em;
  }

  footer.bar {
    margin-top: 24px;
    margin-inline: -16px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--line);
  }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    border: none;
    padding: 11px 16px;
    cursor: pointer;
  }
  button.primary {
    background: var(--navy);
    color: #FFFFFF;
    flex: 1;
  }
  button.primary:active { opacity: 0.85; }
  button.ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--input-border);
  }
  .status {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
    min-height: 14px;
  }

  .copy-box {
    display: none;
    margin-top: 10px;
    padding: 12px;
  }
  .copy-box.show { display: block; }
  .copy-box textarea {
    width: 100%;
    height: 140px;
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    padding: 8px;
    background: var(--input-bg);
    color: var(--ink);
  }
  .copy-box p { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-soft); }

  button.small { padding: 8px 14px; font-size: 12.5px; }

  .summary-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .summary-overlay[hidden] { display: none; }
  .summary-back {
    align-self: flex-start;
    background: transparent;
    border: none;
    color: var(--navy);
    font-weight: 700;
    font-size: 13px;
    padding: 12px 16px 4px;
    cursor: pointer;
  }
  .summary-viewport {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    padding: 4px 16px;
  }
  .summary-fit {
    width: 100%;
    max-width: 640px;
    transform-origin: top center;
  }
  .summary-title {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 19px;
    color: var(--navy);
    margin: 0 0 2px;
  }
  .summary-meta {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .summary-list {
    display: flex;
    flex-direction: column;
  }
  .summary-row {
    display: grid;
    grid-template-columns: 58px 108px 1fr;
    gap: 8px;
    align-items: baseline;
    min-width: 0;
    padding-block: 5px;
    border-bottom: 1px solid var(--line);
  }
  .summary-time {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--orange);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .summary-time.empty { color: var(--muted); font-style: italic; font-weight: 400; }
  .summary-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .summary-answer {
    font-size: 12.5px;
    color: var(--ink);
    min-width: 0;
    overflow-wrap: break-word;
  }
  .summary-answer.empty { color: var(--muted); font-style: italic; }

  .prep-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 2px solid var(--line);
  }
  .prep-title {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 14.5px;
    color: var(--navy);
    margin: 0 0 8px;
  }
  .prep-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
  }
  .prep-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--ink);
    background: var(--surface-rail);
    border-radius: 999px;
    padding: 4px 6px 4px 12px;
    white-space: nowrap;
    min-width: 0;
  }
  .prep-name { min-width: 0; }
  .prep-qty {
    font: inherit;
    font-size: 11.5px;
    width: 2.6em;
    min-width: 0;
    text-align: center;
    border: 1px solid var(--input-border);
    border-radius: 999px;
    background: var(--input-bg);
    color: var(--ink);
    padding: 2px 2px;
    box-sizing: border-box;
    -moz-appearance: textfield;
  }
  .prep-qty::-webkit-outer-spin-button,
  .prep-qty::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .prep-qty:focus-visible { outline: none; border-color: var(--focus); }
  .prep-unit { font-size: 11px; color: var(--muted); }
  .prep-list li.prep-empty {
    background: transparent;
    color: var(--muted);
    font-style: italic;
    padding: 0;
    white-space: normal;
  }

  .summary-footer {
    padding: 8px 16px 14px;
    text-align: center;
    flex: 0 0 auto;
  }
  .summary-hint { font-size: 11px; color: var(--muted); margin: 0 0 8px; }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="mainWrap">
  <header class="top">
    <h1>当日の摂取計画ワークシート</h1>
    <p class="subtitle">試合時間に合わせて、自分の当日プランを埋めていきましょう</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 6 記入</div>
    </div>
  </header>

  <section class="card intro">
    <p>真ん中の「記入例」を参考にしながら、それぞれの欄に当日の食事・水分補給プランを書き込んでください。入力内容はこの端末に自動で保存されます。</p>
    <div class="fields">
      <div class="field"><label for="fName">氏名</label><input id="fName" type="text" autocomplete="off"></div>
      <div class="field"><label for="fEvent">試合種目</label><input id="fEvent" type="text" autocomplete="off"></div>
      <div class="field full">
        <label for="fTime">試合時刻</label>
        <input id="fTime" type="text" placeholder="例：11:00" autocomplete="off">
        <p class="field-hint">入力すると、下の朝食・補食・試合直前の時刻が自動で計算されます</p>
      </div>
    </div>
  </section>

  <div class="legend">
    <span><i class="swatch" style="background:var(--cat-n)"></i>栄養補給のポイント</span>
    <span><i class="swatch" style="background:var(--cat-h)"></i>暑熱対策のポイント</span>
    <span><i class="swatch" style="background:var(--cat-b)"></i>両方のポイント</span>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="card copy-box" id="copyBox">
    <p>お使いの環境では自動保存ができないため、下の内容を長押し・全選択してコピーしてください。</p>
    <textarea id="copyText" readonly></textarea>
    <div class="status" id="copyStatus"></div>
  </div>

  <footer class="bar">
    <button class="ghost" id="resetBtn" type="button">リセット</button>
    <button class="primary" id="saveBtn" type="button">入力完了・まとめを見る</button>
  </footer>
  <p class="status" id="saveStatus">&nbsp;</p>
</div>

<div class="summary-overlay" id="summaryOverlay" hidden>
  <button class="summary-back" id="summaryBack" type="button">← 編集に戻る</button>
  <div class="summary-viewport" id="summaryViewport">
    <div class="summary-fit" id="summaryFit">
      <p class="summary-title">当日の摂取計画　まとめ</p>
      <p class="summary-meta" id="summaryMeta"></p>
      <div class="summary-list" id="summaryList"></div>
      <div class="prep-section">
        <p class="prep-title">事前に用意するものリスト</p>
        <ul class="prep-list" id="prepList"></ul>
      </div>
    </div>
  </div>
  <div class="summary-footer">
    <p class="summary-hint">この画面をスクリーンショットして送ってください</p>
    <button class="ghost small" id="summarySaveFile" type="button">テキストでも保存する</button>
  </div>
</div>

<script>
(function () {
  var EVENTS = [
    { id: 'wake', time: '6:30', name: '起床', ex: [
      ['b', '体重測定・コンディション記録を行う'],
      ['n', '目覚めの水分補給をとる']
    ]},
    { id: 'breakfast', time: '7:00', name: '朝食（試合4時間前）', ex: [
      ['n', 'ごはん・みそ汁・卵料理・果物など、普段通りの食事をとる'],
      ['n', '主食を中心に。脂質・食物繊維の多いものは控えめに']
    ]},
    { id: 'move', time: '8:00', name: '会場への移動', ex: [
      ['h', 'こまめな水分補給を心がける'],
      ['h', 'アイスベストなど暑熱対策グッズを準備する']
    ]},
    { id: 'snack1', time: '9:00', name: '補食（試合1〜2時間前）', ex: [
      ['n', 'バナナ・ゼリー・スポーツドリンクなど、消化の良い糖質源をとる']
    ]},
    { id: 'presnack', time: '10:30', name: '試合直前（〜30分前）', ex: [
      ['n', 'ゼリー飲料＋少量の水分で最終エネルギー補給']
    ]},
    { id: 'aftergame', time: '〜11:30', name: '試合直後（30分以内）', ex: [
      ['n', 'オレンジジュース＋カステラ、鮭おにぎりなど（糖質＋たんぱく質）を補給'],
      ['h', '冷たい飲料で体の内部から冷やす']
    ]}
  ];

  var STORAGE_KEY = 'apw-worksheet-v1';
  var state = { name: '', event: '', time: '', answers: {}, times: {}, prepQty: {} };

  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') return parsed;
      }
    } catch (e) {}
    return null;
  }

  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var timelineEl = document.getElementById('timeline');
  var progressFill = document.getElementById('progressFill');
  var progressLabel = document.getElementById('progressLabel');
  var saveStatus = document.getElementById('saveStatus');

  function updateProgress() {
    var filled = 0;
    EVENTS.forEach(function (ev) {
      if ((state.answers[ev.id] || '').trim().length > 0) filled++;
    });
    var pct = Math.round((filled / EVENTS.length) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = filled + ' / ' + EVENTS.length + ' 記入';
  }

  var saveTimer = null;
  function scheduleSave(msg) {
    saveStatus.textContent = msg || '入力中…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveLocal();
      saveStatus.textContent = '自動保存しました（この端末に保存）';
    }, 400);
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight) + 'px';
  }

  function render() {
    timelineEl.innerHTML = '';
    EVENTS.forEach(function (ev) {
      var row = document.createElement('div');
      row.className = 'event';

      var rail = document.createElement('div');
      rail.className = 'rail';
      rail.innerHTML = '<div class="line top"></div><div class="node"></div><div class="line bottom"></div>';
      row.appendChild(rail);

      var body = document.createElement('div');
      body.className = 'event-body';

      var head = document.createElement('div');
      head.className = 'event-head';

      var timeInput = document.createElement('input');
      timeInput.type = 'text';
      timeInput.className = 'time-input mono';
      timeInput.id = 'time-' + ev.id;
      timeInput.placeholder = ev.time;
      timeInput.autocomplete = 'off';
      timeInput.inputMode = 'numeric';
      timeInput.value = state.times[ev.id] || '';
      timeInput.addEventListener('input', function () {
        state.times[ev.id] = timeInput.value;
        scheduleSave();
      });
      head.appendChild(timeInput);

      var nameSpan = document.createElement('span');
      nameSpan.className = 'event-name';
      nameSpan.textContent = ev.name;
      head.appendChild(nameSpan);

      body.appendChild(head);

      var ul = document.createElement('ul');
      ul.className = 'examples';
      ev.ex.forEach(function (pair) {
        var li = document.createElement('li');
        li.className = pair[0];
        li.textContent = pair[1];
        ul.appendChild(li);
      });
      body.appendChild(ul);

      var label = document.createElement('p');
      label.className = 'plan-label';
      label.textContent = 'あなたのプラン';
      body.appendChild(label);

      var ta = document.createElement('textarea');
      ta.className = 'plan';
      ta.id = 'plan-' + ev.id;
      ta.placeholder = '自分の予定を書いてみましょう';
      ta.rows = 1;
      ta.value = state.answers[ev.id] || '';
      if (ta.value.trim()) ta.classList.add('filled');
      ta.addEventListener('input', function () {
        state.answers[ev.id] = ta.value;
        ta.classList.toggle('filled', ta.value.trim().length > 0);
        autoGrow(ta);
        updateProgress();
        scheduleSave();
      });
      body.appendChild(ta);

      row.appendChild(body);
      timelineEl.appendChild(row);

      requestAnimationFrame(function () { autoGrow(ta); });
    });
  }

  // Minutes to subtract from match time for each auto-calculated event.
  var TIME_OFFSETS_MIN = { breakfast: 240, snack1: 90, presnack: 30 };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function parseTimeToMinutes(v) {
    v = (v || '').trim();
    var m = /^(\d{1,2})[:：](\d{1,2})$/.exec(v);
    if (!m) m = /^(\d{1,2})時(\d{1,2})?分?$/.exec(v);
    if (!m) return null;
    var h = parseInt(m[1], 10);
    var mnt = m[2] ? parseInt(m[2], 10) : 0;
    if (isNaN(h) || isNaN(mnt) || h < 0 || h > 23 || mnt < 0 || mnt > 59) return null;
    return h * 60 + mnt;
  }

  function minutesToTimeStr(total) {
    var t = ((total % 1440) + 1440) % 1440;
    return Math.floor(t / 60) + ':' + pad2(t % 60);
  }

  function recalcEventTimesFromMatchTime() {
    var base = parseTimeToMinutes(state.time);
    if (base === null) return;
    Object.keys(TIME_OFFSETS_MIN).forEach(function (id) {
      var derived = minutesToTimeStr(base - TIME_OFFSETS_MIN[id]);
      state.times[id] = derived;
      var input = document.getElementById('time-' + id);
      if (input) input.value = derived;
    });
  }

  function bindFields() {
    var fName = document.getElementById('fName');
    var fEvent = document.getElementById('fEvent');
    var fTime = document.getElementById('fTime');
    fName.value = state.name || '';
    fEvent.value = state.event || '';
    fTime.value = state.time || '';
    fName.addEventListener('input', function () { state.name = fName.value; scheduleSave(); });
    fEvent.addEventListener('input', function () { state.event = fEvent.value; scheduleSave(); });
    fTime.addEventListener('input', function () {
      state.time = fTime.value;
      recalcEventTimesFromMatchTime();
      scheduleSave();
    });
  }

  function buildSummaryText() {
    var lines = [];
    lines.push('当日の摂取計画ワークシート');
    lines.push('日本パラ陸上 強化合宿｜栄養サポート講義');
    lines.push('');
    lines.push('氏名：' + (state.name || '（未記入）'));
    lines.push('試合種目：' + (state.event || '（未記入）'));
    lines.push('試合時刻：' + (state.time || '（未記入）'));
    lines.push('');
    EVENTS.forEach(function (ev) {
      var time = (state.times[ev.id] || '').trim();
      lines.push('[' + (time || '時刻未記入') + '] ' + ev.name);
      var plan = (state.answers[ev.id] || '').trim();
      lines.push('自分のプラン：' + (plan || '（未記入）'));
      lines.push('');
    });
    lines.push('事前に用意するものリスト（朝食以外の記入内容より自動作成）');
    var prepItems = buildPrepList();
    if (prepItems.length === 0) {
      lines.push('（記入なし）');
    } else {
      prepItems.forEach(function (item) {
        var qty = (state.prepQty[item] || '').toString().trim();
        lines.push('・' + item + (qty ? '　×' + qty + '個' : ''));
      });
    }
    return lines.join('\n');
  }

  function sanitizeFilename(base) {
    return base.replace(/[\\/:*?"<>|]/g, '').trim();
  }

  var resetBtn = document.getElementById('resetBtn');
  resetBtn.addEventListener('click', function () {
    if (!confirm('入力した内容をすべて消去します。よろしいですか？')) return;
    state = { name: '', event: '', time: '', answers: {}, times: {}, prepQty: {} };
    saveLocal();
    render();
    bindFields();
    updateProgress();
    saveStatus.textContent = 'リセットしました';
    document.getElementById('copyBox').classList.remove('show');
  });

  var saveBtn = document.getElementById('saveBtn');
  var copyBox = document.getElementById('copyBox');
  var copyText = document.getElementById('copyText');
  var copyStatus = document.getElementById('copyStatus');

  function downloadTextFile(filename, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function saveToFile() {
    var text = buildSummaryText();
    var namePart = state.name ? state.name + 'の' : '';
    var filename = sanitizeFilename('当日の摂取計画_' + namePart + '記入') + '.txt';

    (async function () {
      var downloads = null;
      try {
        downloads = (typeof window.claude !== 'undefined' && window.claude.use) ? await window.claude.use('downloads') : null;
      } catch (e) { downloads = null; }

      if (downloads) {
        try {
          await downloads.save({ filename: filename, data: text });
          saveStatus.textContent = '保存しました：' + filename;
          copyBox.classList.remove('show');
          return;
        } catch (err) {
          if (err && err.code === 'declined') {
            saveStatus.textContent = '保存をキャンセルしました';
            return;
          }
          // fall through
        }
      }

      // Plain browser: trigger a real file download.
      try {
        downloadTextFile(filename, text);
        saveStatus.textContent = 'ファイルをダウンロードしました：' + filename;
      } catch (e) {
        saveStatus.textContent = '';
      }

      // Always also offer copy, in case the download didn't reach the user (e.g. in-app browsers).
      copyText.value = text;
      copyBox.classList.add('show');
      copyStatus.textContent = '';
      try {
        await navigator.clipboard.writeText(text);
        copyStatus.textContent = 'クリップボードにもコピーしました';
      } catch (e) {
        copyStatus.textContent = '保存できない場合は、上の欄を選択してコピーしてください';
      }
    })();
  }

  // ---- Single-screen summary (for a one-tap screenshot) ----
  var summaryOverlay = document.getElementById('summaryOverlay');
  var summaryViewport = document.getElementById('summaryViewport');
  var summaryFit = document.getElementById('summaryFit');
  var summaryList = document.getElementById('summaryList');
  var summaryMeta = document.getElementById('summaryMeta');

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function buildSummaryScreen() {
    summaryList.innerHTML = '';
    EVENTS.forEach(function (ev) {
      var plan = (state.answers[ev.id] || '').trim();
      var time = (state.times[ev.id] || '').trim();
      var row = document.createElement('div');
      row.className = 'summary-row';
      row.innerHTML =
        '<span class="summary-time mono' + (time ? '' : ' empty') + '">' + (time ? escapeHtml(time) : '未記入') + '</span>' +
        '<span class="summary-name">' + escapeHtml(ev.name) + '</span>' +
        '<span class="summary-answer' + (plan ? '' : ' empty') + '">' + (plan ? escapeHtml(plan) : '未記入') + '</span>';
      summaryList.appendChild(row);
    });
    var metaParts = [];
    if (state.name) metaParts.push('氏名：' + state.name);
    if (state.event) metaParts.push('種目：' + state.event);
    if (state.time) metaParts.push('試合時刻：' + state.time);
    summaryMeta.textContent = metaParts.join('　');

    renderPrepList();
  }

  // Everything except breakfast is assumed to need advance preparation
  // (packing, buying, pre-mixing) rather than being cooked on the spot.
  var PREP_EXCLUDE_IDS = ['breakfast'];
  var PREP_SPLIT_RE = /[、，,・\/／\+＋\s]+/;

  function buildPrepList() {
    var seen = {};
    var items = [];
    EVENTS.forEach(function (ev) {
      if (PREP_EXCLUDE_IDS.indexOf(ev.id) !== -1) return;
      var text = (state.answers[ev.id] || '').trim();
      if (!text) return;
      text.split(PREP_SPLIT_RE).forEach(function (part) {
        var trimmed = part.trim();
        if (!trimmed) return;
        var key = trimmed.toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        items.push(trimmed);
      });
    });
    return items;
  }

  function renderPrepList() {
    var el = document.getElementById('prepList');
    el.innerHTML = '';
    var items = buildPrepList();
    if (items.length === 0) {
      var li = document.createElement('li');
      li.className = 'prep-empty';
      li.textContent = '朝食以外の欄に記入すると、ここに自動でリストアップされます';
      el.appendChild(li);
      return;
    }
    items.forEach(function (item) {
      var li = document.createElement('li');
      li.className = 'prep-item';

      var name = document.createElement('span');
      name.className = 'prep-name';
      name.textContent = item;
      li.appendChild(name);

      var qty = document.createElement('input');
      qty.type = 'number';
      qty.className = 'prep-qty';
      qty.min = '0';
      qty.inputMode = 'numeric';
      qty.placeholder = '-';
      qty.setAttribute('aria-label', item + 'の個数');
      qty.value = state.prepQty[item] || '';
      qty.addEventListener('input', function () {
        state.prepQty[item] = qty.value;
        scheduleSave();
      });
      li.appendChild(qty);

      var unit = document.createElement('span');
      unit.className = 'prep-unit';
      unit.textContent = '個';
      li.appendChild(unit);

      el.appendChild(li);
    });
  }

  function fitSummary() {
    summaryFit.style.transform = 'scale(1)';
    var natural = summaryFit.scrollHeight;
    var available = summaryViewport.clientHeight;
    var scale = 1;
    if (available > 0 && natural > available) {
      scale = Math.max(0.55, available / natural);
    }
    summaryFit.style.transform = 'scale(' + scale + ')';
  }

  function showSummary() {
    buildSummaryScreen();
    document.getElementById('mainWrap').hidden = true;
    summaryOverlay.hidden = false;
    requestAnimationFrame(function () {
      fitSummary();
      setTimeout(fitSummary, 250); // re-check once web fonts finish swapping in
    });
  }

  function hideSummary() {
    summaryOverlay.hidden = true;
    document.getElementById('mainWrap').hidden = false;
  }

  window.addEventListener('resize', function () {
    if (!summaryOverlay.hidden) fitSummary();
  });

  saveBtn.addEventListener('click', function () {
    saveLocal();
    showSummary();
  });

  document.getElementById('summaryBack').addEventListener('click', hideSummary);
  document.getElementById('summarySaveFile').addEventListener('click', saveToFile);

  function start(initialData) {
    var restored = loadLocal();
    if (restored) {
      state.name = restored.name || '';
      state.event = restored.event || '';
      state.time = restored.time || '';
      state.answers = restored.answers || {};
      state.times = restored.times || {};
      state.prepQty = restored.prepQty || {};
    }
    render();
    bindFields();
    updateProgress();
  }

  start();
})();
</script>
</body>
</html>
